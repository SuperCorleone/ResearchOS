comment: |
  Unblocking after manual fix of two upstream issues identified during /clear-session debug:
  (1) code_recon._detect_entry_points was a hardcoded whitelist; bma_*.py scripts returned
      entry_points=[] so baseline_analyze BLOCKED on contract_guard:strategy_actions_consistent.
      Fix: 3-layer detector (whitelist → __main__ block → bare top-level *.py), limit=10.
  (2) experiment_plan.yaml::evaluation_metrics carried 100+ char vague string — would have
      tripped contract_guard:metric_alignment after RUN. Replaced with paper's actual metrics:
      precision, recall, f1 (RQ1, Sec 5.2.1, Figure 7). RQ2/RQ3 stay out_of_scope.
  Pipeline should now resume baseline_analyze with fixed code_recon.yaml + matching plan metrics.
