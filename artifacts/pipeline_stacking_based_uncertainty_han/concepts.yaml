  - id: C2
    definition: "A probabilistic model combination technique, weighting models based on their posterior probabilities."
    math_formula: "Model combination prediction = sum_i posterior(model_i) * prediction(model_i)"
    code_implementation: "matteocamilli__bma-package::src/bma/combination.py::L25-L45"
    reference_papers:
      - "Taming Model Uncertainty in Self-Adaptive Systems Using Bayesian Model Averaging"
