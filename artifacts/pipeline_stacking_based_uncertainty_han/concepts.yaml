    definition: "An ensemble techique using a meta-learner to combine multiple model predictions, optimizing the weights based on cross-validation performance."
    math_formula: ""
    code_implementation: "matteocamilli__bma-package::src/ensemble/stacking.py::L10-L30"
    reference_papers:
