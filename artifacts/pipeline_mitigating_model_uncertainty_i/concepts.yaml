  - id: C2
    definition: "A statistical technique that averages over multiple models weighted by their posterior probabilities to account for model uncertainty."
    math_formula: "p(y | x) = \sum_{m} p(y | x, M_m) p(M_m | x)"
    code_implementation: "NOT_AVAILABLE"
    reference_papers:
