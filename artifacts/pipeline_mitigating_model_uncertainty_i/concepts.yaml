concepts:
  - id: C1
    definition: "A method to combine predictions from multiple models by learning combination weights to optimize out-of-sample predictive performance."
    math_formula: "\\hat{y} = g(\sum_{k=1}^{K} \alpha_k \hat{y}^{(k)})"
    code_implementation: "NOT_AVAILABLE"
    reference_papers:
      - "Wolpert, D. H. (1992). Stacked Generalization."
