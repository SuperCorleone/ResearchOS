requires_code: true

data:
  dataset_name: "Search-and-rescue robot runtime traces from Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
  version: "reference-paper dataset version; exact artifact/trace file to be resolved before run"
  source: "file"
  license: "unknown"
  description: "Use the exact robotics runtime traces/data files from the reference paper's case study, covering the semantic-space variables power, cruise speed, bandwidth, quality, illuminance, smoke intensity, obstacle size, obstacle distance, and firm obstacle, plus the target event/outcome used by the Analyze component. No synthetic substitute is allowed. If the public dataset is unavailable, the experiment is blocked until the original traces or author-provided replication package are obtained."
  risk_notes:
    - "License is unclear from the paper/KB excerpt; obtain license/usage permission before execution."
    - "Reference paper does not expose an exact downloadable filename in current artifacts; execution is blocked pending recovery of the original data files or author replication package."
    - "Potential temporal/runtime leakage if traces are randomly shuffled; preserve the reference paper's split and replay ordering exactly."
    - "Sample count is currently unknown; if sample_count < 1000, switch evaluation reporting to include uncertainty-aware resampling or repeated replay and note reduced power."
  consistency_requirement:
    reference_paper: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
    must_match: ["dataset_version", "train_test_split", "preprocessing_pipeline"]
    verification: "Verify by matching file hashes or exact filenames against the reference replication package, reproducing the same split indices/order, and diff-checking the preprocessing/encoding pipeline against the reference implementation or paper appendix before any comparison run."

reference_code:
  papers:
    - title: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
      repo_url: "https://github.com/matteocamilli/bma-package"
      repo_status: "available"
      reusable_components: ["Bayesian model averaging routines", "candidate GLM model-space handling", "possibly MCMC exploration utilities"]
      must_modify: ["replace only the Analyze combiner with stacking meta-learner", "add out-of-fold prediction generation", "retain same Plan/Execute pipeline and evaluation hooks"]
      build_on_top: true
      reason: "Faithful reproduction of the reference baseline and reuse of the original modeling/evaluation pipeline reduce implementation drift and strawman risk."
  strategy: "fork_and_extend"

reference_methodology:
  paper: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
  model_space: "the same candidate GLM scenario/model space used by TUNE for the robotics case study; no simplification of candidate models is allowed"
  algorithms: ["Bayesian Model Averaging", "MCMC exploration of model space", "metaheuristic optimizing search in Plan"]
  evaluation_metrics: ["accuracy", "effectiveness", "cost", "Brier score", "requirement-violating adaptation rate", "Analyze latency"]
  cv_strategy: "match the exact reference train/test split and any internal validation strategy used by the reference implementation; for stacking, generate out-of-fold predictions only within the original training partition"
  data_files: ["exact runtime trace files from the reference paper replication package or author-provided data artifact"]
  key_implementation_details: ["Analyze uses BMA over candidate GLMs", "Plan uses the same metaheuristic optimization as the reference", "stacking must use the same base-model predictions from the identical GLM model space", "no changes to requirements, semantic variables, or planner objective/constraints"]

proposed_method:
  what_is_new: "Replace the final Analyze-stage combiner from posterior-probability Bayesian model averaging to a stacking-based meta-learner trained on out-of-fold predictions from the same candidate GLMs."
  what_is_borrowed: "Reference dataset/traces, semantic-space features, candidate GLM model space, preprocessing, train/test split, planning/metaheuristic search, and baseline BMA implementation."
  why_improvement_expected: "Stacking optimizes held-out predictive performance directly and may better exploit complementary errors among plausible GLMs, improving calibration/Brier score and thereby reducing downstream requirement-violating adaptation decisions while keeping the rest of the control loop fixed."

user_directives_applied: []

plan_dataset:
  name: "Reference robotics runtime traces from SEAMS'22 TUNE study"
  source: "file"
  license: "unknown"
  preprocessing:
    - "Reuse the exact preprocessing pipeline and feature encoding from the reference paper/repository."
    - "Preserve semantic-space variables exactly as defined in the paper: power, cruise speed, bandwidth, quality, illuminance, smoke intensity, obstacle size, obstacle distance, firm obstacle."
    - "Recreate the reference target variable(s) for the Analyze component exactly; do not redefine labels."
    - "Generate stacking training features as out-of-fold predictions from the same candidate GLMs on the training split only."
    - "Standardize/encode features only if and exactly as done in the reference implementation."
  split:
    strategy: "temporal"
    ratio: "match reference split exactly"
    seed: 42
    risk_notes: "Runtime traces are vulnerable to leakage if random shuffling mixes future observations into past decisions; therefore use the exact reference split/order and replay protocol. If the reference split was not temporal, still reproduce it exactly for faithfulness, but document any leakage concern and add a stricter temporal sensitivity check before claiming improvement."
  sample_count: null
  consistency_requirement:
    reference_paper: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
    must_match: ["dataset_version", "train_test_split", "preprocessing_pipeline"]

plan_model:
  family: "ensemble of generalized linear models with meta-learner combiner"
  architecture: "Baseline: reference TUNE Bayesian Model Averaging over the original candidate GLM scenario space with MCMC exploration. Proposed: same candidate GLM base models, but final prediction produced by a stacking meta-learner trained on out-of-fold base-model probabilities; Plan component unchanged. Preferred fast-fail meta-learner: constrained logistic regression on base predictions; fallback comparison: non-negative linear stacking if reference interfaces require simpler combination."
  parameters: "N/A"
  hyperparameters:
    - name: "stacking_meta_learner"
      values: ["logistic_regression", "non_negative_linear"]
    - name: "stacking_regularization_C"
      values: ["0.1", "1.0", "10.0"]
    - name: "stacking_fit_intercept"
      values: ["true", "false"]
    - name: "oof_folds_within_training"
      values: ["5"]
    - name: "base_model_space"
      values: ["exact_reference_model_space_only"]
  reference_implementation: "https://github.com/matteocamilli/bma-package"

plan_training:
  optimizer: "LBFGS or equivalent deterministic solver for logistic meta-learner; reference optimizer/settings for baseline BMA as in repo"
  learning_rate: 0.0
  batch_size: 0
  epochs_or_steps: 1
  schedule: "none; closed-form/convex optimization where applicable, plus reference BMA/MCMC runtime settings unchanged"
  seeds: [42, 123, 456]
  num_runs: 3
  hardware: "CPU workstation (e.g., 8-core x86_64, 32GB RAM); same hardware class for baseline and proposed"
  estimated_runtime: "2-4 hours including faithful baseline reproduction, OOF generation, and replay evaluation"
  estimated_cost_credits: 20
  measurement_type: "estimated"
  confound_controls:
    initialization: "Baseline uses the reference initialization/MCMC settings; stacking meta-learner uses fixed deterministic solver per seed, with randomness only in fold partitioning if needed."
    hyperparam_search: "small fixed grid applied only to stacking meta-learner within the training partition; baseline receives no extra tuning beyond faithful reproduction. Report both raw comparison and a resource-normalized comparison if stacking tuning adds compute."
    data_split: "fixed reference train/test split for all methods; identical inner OOF folds across stacking variants and seeds where possible."
    hardware_noise: "Run all methods on the same machine, isolate CPU load, repeat 3 seeds/runs, and report mean ± std latency and predictive metrics."

plan_testing:
  metrics:
    - name: "Brier score"
      direction: "lower_better"
      threshold: 0.02
    - name: "requirement-violating adaptation rate"
      direction: "lower_better"
      threshold: 0.05
    - name: "expected calibration error"
      direction: "lower_better"
      threshold: null
    - name: "mean Analyze latency (ms/decision)"
      direction: "lower_better"
      threshold: 0.10
  statistical_tests:
    - name: "descriptive_mean_std"
      purpose: "FAST_FAIL stage reporting across seeds/runs for predictive quality, adaptation quality, and latency"
      report: ["mean", "std", "n"]
  baselines:
    - name: "Reference TUNE Bayesian Model Averaging baseline"
      why_chosen: "This is the exact method from the reference paper and the strongest mandatory baseline for a faithful improvement claim."
      resource_parity: "Same dataset, split, preprocessing, candidate GLM model space, planner, replay traces, seeds, hardware, and reporting. If stacking uses inner-fold tuning, add compute-normalized reporting and disclose extra training overhead."
    - name: "Best single GLM selected from the same reference model space"
      why_chosen: "Provides a sanity-check lower baseline to confirm that any gain is due to combining models rather than implementation artifacts, while still staying within the reference model space."
      resource_parity: "Use the same candidate models and data; no extra features or data allowed. This comparison changes only the combination rule."
  ablation:
    - component: "Analyze combiner"
      replacement: "remove"
      purpose: "Compare stacking against the best single GLM to isolate the value of combining multiple candidate models versus selecting one model."
    - component: "stacking meta-learner"
      replacement: "constant"
      purpose: "Replace learned combiner weights with uniform averaging over the same base GLM predictions to test whether gains come from learned meta-combination rather than simple averaging."
  success_criteria:
    - "On the held-out reference test/replay traces, stacking achieves at least 0.02 lower mean Brier score than the faithful BMA baseline."
    - "On the same traces and unchanged planner, stacking reduces requirement-violating adaptation rate by at least 5% relative to BMA."
    - "Mean Analyze latency increase is no more than 10% relative to BMA, or any larger increase is justified by clearly larger quality gains."
    - "Across 3 runs/seeds, the direction of improvement is consistent for Brier score and does not reverse catastrophically on any run."
  failure_conditions:
    - "Brier score improvement over BMA is less than 0.01 on average."
    - "Requirement-violating adaptation rate differs from BMA by less than 2%, or is worse."
    - "Analyze latency increases by more than 10% without compensating adaptation-quality gains."
    - "The exact reference dataset, preprocessing pipeline, or split cannot be recovered; in that case the experiment is invalid and must not proceed."
