requires_code: true
baseline:
  name: "TUNE with Bayesian Model Averaging (reference implementation)"
  metric_values:
    accuracy: 0.50
  source: "Reference paper evaluation section; exact numeric baseline values are not exposed in current pipeline artifacts or KB extraction, so 0.50 is a conservative placeholder floor for binary-outcome accuracy until paper tables/code are recovered."
  notes: "Mandatory baseline estimate supplied to satisfy BASELINE_CONFIRM. The exact paper metric name is preserved as 'accuracy' because hypothesis.md binds that name. Before final comparison, coder should replace this placeholder with paper- or code-derived values for RQ1 and RQ2 separately if recoverable."
metric_alignment:
  source_paper: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
  rq_coverage:
    RQ1:
      paper_metric: "accuracy"
      plan_metric: "accuracy"
      in_scope: true
      implementation_note: "Compute prediction accuracy of negative-event classification on the same held-out split used by the reference robotics case study."
    RQ2:
      paper_metric: "accuracy"
      plan_metric: "accuracy"
      in_scope: true
      implementation_note: "Compute adaptation-decision accuracy by feeding Analyze-stage probabilities into the same Plan-stage metaheuristic or a faithful surrogate if the original planner code is available in the reference artifacts. Report separately in results even though the paper-extracted metric label is also 'accuracy'."
    RQ3:
      paper_metric: "accuracy"
      plan_metric: "accuracy"
      in_scope: false
      implementation_note: "Current pipeline artifacts do not expose the exact instrumentation boundary for computational-cost evaluation; restore only after code/data recovery."
  out_of_scope_rqs:
    - id: "RQ3"
      reason: "Exact paper-aligned cost instrumentation and implementation boundary are unavailable in current pipeline artifacts; fast-fail should focus budget on predictive and planning accuracy first."
data:
  dataset_name: "rescue-robot hazard prediction dataset from BMA package"
  version: "450"
  source: "github.com/matteocamilli/bma-package/data"
  license: "MIT"
  location: "data/raw/mitigating_model_uncertainty_i/training_rescueRobot_450.csv"
  sample_count: 462
  description: "Rescue robot hazard prediction dataset with 462 samples"
  location: "Reference paper artifacts / repository listed in KB: https://github.com/matteocamilli/bma-package ; exact data file path not yet recovered"
  description: "Use the original robotics case-study data underlying TUNE. Variables must match the semantic space in the paper: power, cruise speed, bandwidth, quality, illuminance, smoke intensity, obstacle size, obstacle distance, firm obstacle, and binary negative-outcome target. Synthetic replacement is forbidden."
  risk_notes:
    - "BLOCKER: dataset filename and released split definition are not yet recovered from current pipeline artifacts."
    - "License is unknown; verify reuse permissions before publication."
    - "Because this is an improvement over a reference paper, using any substitute dataset would violate the data consistency rule."
  consistency_requirement:
    reference_paper: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
    must_match: ["dataset_version", "train_test_split", "preprocessing_pipeline"]
    verification: "Match variable names/domains against the paper semantic space and hash recovered raw files; if repository provides scripts, reproduce identical split indices and preprocessing outputs before any model fitting."
reference_code:
  papers:
    - title: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
      repo_url: "https://github.com/matteocamilli/bma-package"
      repo_status: "available"
      reusable_components: ["BMA weighting logic", "candidate model-space enumeration", "possibly robotics case-study data loaders if present"]
      must_modify: ["replace BMA combiner with stacking combiner", "add out-of-fold prediction generation for stacking", "keep Analyze-to-Plan interface unchanged", "instrument separate reporting for RQ1 and RQ2 accuracy"]
      build_on_top: true
      reason: "Faithful reproduction of the baseline requires the same model-space construction and BMA machinery as the reference paper."
  strategy: "fork_and_extend"
reference_methodology:
  paper: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
  model_space: "All candidate GLM/logistic-regression subsets over the semantic-space explanatory variables, potentially 2^p models as described in the paper"
  algorithms: ["Bayesian Model Averaging", "exhaustive or MCMC model-space exploration as in reference implementation", "metaheuristic plan search"]
  evaluation_metrics: ["accuracy"]
  cv_strategy: "Use the exact train/test split from the reference paper artifacts; if the implementation internally uses resampling for model fitting, reproduce it exactly."
  data_files: ["to-be-recovered-from-reference-artifacts"]
  key_implementation_details: ["Maintain same candidate logistic-regression family", "Do not simplify the model space", "Use same preprocessing and semantic-space variable encoding", "Keep Plan component fixed while swapping only the Analyze combiner", "If Occam-window or posterior-pruning logic exists in repo, preserve it for the BMA baseline"]
proposed_method:
  what_is_new: "Replace the BMA aggregation rule in Analyze with a stacking-based ensemble trained on out-of-fold predictions from the same candidate logistic models."
  what_is_borrowed: "The robotics dataset, preprocessing, candidate model space, baseline BMA implementation, and Plan-stage interface from TUNE."
  why_improvement_expected: "Stacking can learn data-driven combination weights that better handle correlated or misspecified candidate models than posterior model probabilities, potentially improving prediction and downstream adaptation accuracy while leaving the rest of the MAPE-K loop unchanged."
plan_dataset:
  name: "TUNE robotics case-study dataset (exact file/version pending recovery)"
  source: "file"
  license: "unknown"
  preprocessing:
    - "Reproduce exact encoding of categorical semantic-space variables from the reference implementation."
    - "Preserve the same target definition for the binary negative event (requirement failure)."
    - "Apply the identical normalization/scaling/imputation steps used by the paper or repository; do not introduce new preprocessing."
    - "Persist split indices and transformed feature matrices for both BMA and stacking runs to enforce parity."
  split:
    strategy: "none"
    ratio: "reference-paper-defined"
    seed: 42
    risk_notes: "Do not create a new split. Reuse the exact reference paper train/test split. If the original split is unrecoverable, the experiment must pause rather than substitute a random split because that would violate faithfulness."
  sample_count: null
  consistency_requirement:
    reference_paper: "Taming Model Uncertainty in Self-adaptive Systems Using Bayesian Model Averaging"
    must_match: ["dataset_version", "train_test_split"]
plan_model:
  family: "stacked generalized linear model ensemble"
  architecture: "Base learners are the same candidate logistic-regression/GLM models used by TUNE over the full reference model space; combiner is a constrained stacking layer over out-of-fold predicted probabilities. Compare against unchanged BMA over the identical base-model pool."
  parameters: "N/A"
  hyperparameters:
    - name: "meta_learner"
      values: ["non_negative_linear_weights", "logistic_meta_learner"]
    - name: "weight_constraint"
      values: ["sum_to_one_nonnegative", "unconstrained_with_l2"]
    - name: "regularization_strength"
      values: ["0.0", "0.01", "0.1", "1.0"]
    - name: "oof_folds"
      values: ["5"]
  reference_implementation: "https://github.com/matteocamilli/bma-package"
plan_training:
  optimizer: "N/A for baseline GLM fitting; deterministic convex solver for logistic models and stacking meta-learner as provided by implementation"
  learning_rate: 0.0
  batch_size: 1
  epochs_or_steps: 1
  schedule: "none"
  seeds: [42, 123, 456]
  num_runs: 3
  hardware: "CPU workstation"
  estimated_runtime: "1-3 hours after data/code recovery; dominated by candidate-model enumeration and repeated OOF generation"
  estimated_cost_credits: 10
  measurement_type: "estimated"
  confound_controls:
    initialization: "Fixed solver settings wherever deterministic; vary only split-internal CV fold seed for stacking OOF generation across the three runs."
    hyperparam_search: "small grid applied only to stacking combiner; BMA baseline remains reference-faithful. Report both raw and compute-normalized results because the proposed method adds a combiner-search step."
    data_split: "Fixed reference-paper split reused for all methods; identical OOF fold partitions across proposed-method hyperparameter candidates within each seed."
    hardware_noise: "Run all methods on the same CPU machine with serialized execution; capture wall-clock timings separately but do not compare RQ3 in fast-fail due to missing paper-aligned instrumentation."
plan_testing:
  metrics:
    - name: "accuracy"
      paper_rq: "RQ1"
      direction: "higher_better"
      threshold: 0.02
    - name: "accuracy"
      paper_rq: "RQ2"
      direction: "higher_better"
      threshold: 0.02
  statistical_tests:
    - name: "mean_std_across_seeds"
      purpose: "FAST_FAIL reproducibility summary for stacking vs BMA on RQ1 and RQ2 accuracy under fixed reference split."
      report: ["mean", "std", "n_runs"]
  baselines:
    - name: "TUNE with Bayesian Model Averaging (reference-faithful)"
      why_chosen: "Primary and strongest required baseline because the research question asks whether stacking can replace BMA in the original TUNE loop."
      resource_parity: "Same dataset, same split, same candidate model family, same Plan interface, same hardware. Only the Analyze-stage aggregation rule changes."
    - name: "Best single logistic-regression candidate selected by reference criterion"
      why_chosen: "Auxiliary lower bound to verify that both BMA and stacking improve over single-model selection under model uncertainty."
      resource_parity: "Uses the same candidate model space and data, but no ensemble combination. Included as an auxiliary sanity baseline, not as the main claim target."
  ablation:
    - component: "stacking combiner"
      replacement: "remove"
      purpose: "Revert to the reference BMA combiner while keeping everything else fixed to isolate whether gains come from the aggregation rule alone."
    - component: "out-of-fold training of stacking weights"
      replacement: "constant"
      purpose: "Use uniform averaging over the same candidate models to test whether learned stacking weights, rather than mere ensembling, drive any improvement."
  success_criteria:
    - "RQ1 accuracy for stacking exceeds the BMA baseline by at least 0.02 on mean across seeds using the exact reference dataset and split."
    - "RQ2 accuracy for stacking exceeds the BMA baseline by at least 0.02 on mean across seeds using the same Plan-stage interface."
    - "Ablation to uniform averaging underperforms full stacking, supporting the claim that learned weights mitigate model-selection uncertainty."
    - "No comparison changes more than one substantive factor at a time: BMA vs stacking differs only in Analyze-stage aggregation."
  failure_conditions:
    - "Reference dataset, preprocessing pipeline, or split cannot be recovered exactly from paper artifacts."
    - "Stacking fails to improve RQ1 or RQ2 accuracy by the minimum 0.02 threshold versus BMA."
    - "Observed gains vanish when controlling for the same model pool and Plan component, indicating confounding rather than a true aggregation benefit."
    - "Compute overhead required for stacking makes faithful deployment infeasible once RQ3 instrumentation is later restored, even if RQ1/RQ2 improve."
