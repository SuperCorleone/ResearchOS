# ============================================================================
# ResearchOS Workflow Configuration
# ============================================================================
#
# This file defines the pipeline step routing that the scheduler uses.
# If this file is missing or invalid, the scheduler falls back to hardcoded
# defaults that match the behavior encoded here.
#
# The top-level `retry:` block (A14) drives retry_state-machine constants
# read via `researchos.runtime.recovery.load_retry_config`.
#
# HOW TO CUSTOMIZE:
#   - Add/remove steps in the `steps` section. Each step needs an agent,
#     output filename, and optionally timeout, retries, and type.
#   - Edit stage sequences to change the order steps execute in.
#   - Use `dynamic_routing` within a stage to branch based on conditions
#     (e.g., skip design_review in fast_fail).
#   - The `type` field controls whether the step runs an LLM agent ("llm")
#     or a Python function ("python"). Default is "llm".
#   - The `output` field for the report step supports "{n}" as a placeholder
#     for the milestone number (e.g., "milestone_{n}.md").
# ============================================================================

# ---------------------------------------------------------------------------
# Model tier configuration (D' — model tiering for token cost optimization)
# ---------------------------------------------------------------------------
# `model_tiers` maps tier labels (T1/T2/T3) to concrete model ids.
# Each value supports `${VAR:-default}` env-var substitution handled by
# `llm_client.get_model_for_agent`.
#
#   T1 — strongest reasoning (defaults to gpt-5.4)
#   T2 — mid-range structured generation (defaults to gpt-4o)
#   T3 — economy tier for low-reasoning steps (defaults to gpt-o4-mini)
#
# `agent_model_tiers` assigns each agent role to a tier. Agents that are
# not listed fall back to the environment variable `RESEARCHOS_MODEL`
# inside `llm_client.get_model_for_agent`.
model_tiers:
  T1: "${RESEARCHOS_MODEL_T1:-gpt-5.4}"
  T2: "${RESEARCHOS_MODEL_T2:-gpt-4o}"
  T3: "${RESEARCHOS_MODEL_T3:-o4-mini}"

agent_model_tiers:
  # T1 — high-reasoning agents
  professor: T1
  knowledge_miner: T1
  hypothesis_gen: T1
  exp_designer: T1
  coder: T1
  critic: T1
  interrogator: T1
  judge: T1                  # merges critic + experiment_analyser + interrogator
  paper_writer: T1
  reviewer_simulator: T1

  # T2 — structured-generation agents
  # design_reviewer removed — scientific review merged into exp_designer self-review
  experiment_analyser: T2
  concept_extractor: T2      # legacy 1-pass; being replaced by 2-pass below
  concept_extract_paper: T2  # 2-pass: paper side (math + refs)
  concept_extract_code: T2   # 2-pass: code side (locators)
  baseline_analyzer: T2      # code-first analysis of cloned baseline package (v5.3)
  # reporter removed — REPORT step is now rendered by researchos.core.publisher
  paper_auditor: T2
  vlm_reviewer: T2
  figure_composer: T2

  # T3 — low-reasoning agents
  experiment_runner: T3

# ---------------------------------------------------------------------------
# Retry state-machine constants (A14)
# ---------------------------------------------------------------------------
# These govern how the scheduler + experiment runner bound retries and
# timeouts. `load_retry_config` in `researchos.runtime.recovery` falls
# back to defaults if this block is missing/invalid.
retry:
  max_runs: 5              # pipeline-level attempts per milestone
  max_iters: 4             # per-run retry iterations
  exp_timeout_seconds: 7200
  plot_timeout_seconds: 600
  max_stderr_chars: 1500

# ---------------------------------------------------------------------------
# Step definitions
# ---------------------------------------------------------------------------
# Each step has:
#   agent    - name of the agent definition (or Python function for type: python)
#   output   - expected output artifact filename
#   timeout  - max seconds before the step is killed (default: 300)
#   retries  - max retry attempts on failure (default: 3)
#   type     - "llm" (default) or "python"

steps:
  hypothesis:
    agent: hypothesis_gen
    output: hypothesis.md
    timeout: 300
    retries: 3
    type: llm

  design:
    agent: exp_designer
    output: experiment_plan.yaml
    timeout: 300
    retries: 3
    type: llm

  # design_review step retired 2026-04 — exp_designer now self-reviews
  # in its own turn (scientific validity) and design_checks.py runs the
  # structural checks (zero-token).

  code_recon:
    # Shallow-clone reference codebases + static scan.
    # Pure Python; no LLM. Runs only in MAIN, between DESIGN and BASELINE_ANALYZE.
    agent: code_recon
    output: code_recon.yaml
    timeout: 240
    retries: 1
    type: python

  baseline_analyze:
    # LLM, code-first analysis of cloned baseline package(s). Greps real IO
    # calls (pd.read_csv, torch.load, wget, urllib.request.urlretrieve, …)
    # in entry-point code to identify which files / external URLs the
    # baseline actually uses. Output baseline_analysis.yaml is consumed by
    # DATA_RECON without further interpretation. Replaces the v5.2
    # heuristic tables in data_recon.py.
    agent: baseline_analyzer
    output: baseline_analysis.yaml
    timeout: 360
    retries: 2
    type: llm

  data_recon:
    # Thin executor of baseline_analysis.yaml: copytree dataset_paths,
    # urlretrieve external_data_urls flagged should_download=true, write
    # data_manifest.yaml. NO heuristics, NO badge filter, NO data-host
    # whitelist — the LLM-side analyser owns those decisions.
    # Pure Python; no LLM. Idempotent (skip if manifest already success).
    agent: data_recon
    output: data_manifest.yaml
    timeout: 360
    retries: 1
    type: python

  code:
    agent: coder
    output: code_patch.diff
    timeout: 300
    retries: 3
    type: llm

  code_preflight:
    agent: code_preflight
    output: preflight_report.json
    timeout: 120
    retries: 3
    type: python

  run:
    agent: experiment_runner
    output: results.json
    timeout: 600
    retries: 3
    type: llm

  critic:
    agent: critic
    output: analysis_report.md
    timeout: 300
    retries: 3
    type: llm

  interrogation:
    agent: interrogator
    output: interrogation_report.md
    timeout: 300
    retries: 3
    type: llm

  report:
    # REPORT is deterministic — rendered by researchos.core.publisher.render_milestone
    # (no LLM, no agent). The scheduler's _run_report() handles it.
    agent: null
    output: "milestone_{n}.md"
    timeout: 60
    retries: 1
    type: python

  experiment_analysis:
    # U9 — post-experiment analysis: ablation studies, sensitivity analysis,
    # visualization proposals. Runs between CRITIC and INTERROGATION in MAIN.
    agent: experiment_analyser
    output: experiment_analysis.md
    timeout: 600
    retries: 2
    type: llm

  figure_compose:
    # C15 — automated figure generation from experiment results.
    # Runs after experiment_analysis in MAIN, before interrogation.
    # 5-stage pipeline: Plan → CodeGen → Render → Critic → Integrate.
    agent: figure_composer
    output: figures/figure_manifest.yaml
    timeout: 900
    retries: 2
    type: llm

  judge:
    # Merged post-run verdict: replaces critic + experiment_analysis + interrogation.
    # Reads digests, calls gen_code_tree_structure / list_file_symbols /
    # grep_code / execute_python, and emits judge_verdict.json (typed).
    agent: judge
    output: judge_verdict.json
    timeout: 600
    retries: 2
    type: llm

  concept_paper:
    # 2-pass concept extraction, paper side: definition + math_formula +
    # reference_papers. No code inspection at this step.
    agent: concept_extract_paper
    output: concepts_paper.digest.json
    timeout: 300
    retries: 3
    type: llm

  concept_code:
    # 2-pass concept extraction, code side: walks code_recon repos with
    # list_file_symbols and fills code_implementation locators. Emits the
    # final merged concepts.digest.json that concept_atomicity guard validates.
    agent: concept_extract_code
    output: concepts.digest.json
    timeout: 300
    retries: 3
    type: llm

# ---------------------------------------------------------------------------
# Review configuration
# ---------------------------------------------------------------------------
# Cross-model adversarial review: neg reviewers use a different model family
# than the paper writer to eliminate self-review blind spots.
# Set model_override to route neg reviewer calls through a different model.
# Leave empty or omit to use the default model for all reviewers.
review:
  model_override: ""  # e.g., "gpt-4o" when paper is written by Claude

# ---------------------------------------------------------------------------
# Stage definitions
# ---------------------------------------------------------------------------
# Each stage has:
#   sequence        - ordered list of step names executed in this stage
#   dynamic_routing - optional overrides where one step can branch to
#                     different next steps based on runtime conditions.
#                     Each entry maps a step to its possible next-step targets
#                     and a description of when each target is chosen.
#
# The scheduler resolves dynamic_routing BEFORE falling back to sequence order.
# If a step appears in dynamic_routing, the scheduler calls its routing logic
# instead of blindly following the sequence list.

stages:
  main:
    sequence:
      - hypothesis
      - design                 # includes integrated scientific self-review
      - code_recon             # shallow-clone reference repos
      - baseline_analyze       # LLM code-first: identify real datasets vs. badges/logs/plots
      - data_recon             # pure-python executor: copy/download per baseline_analysis.yaml
      - concept_paper          # 2-pass concept extraction (paper side)
      - concept_code           # 2-pass concept extraction (code side)
      - code
      - code_preflight
      - run
      - judge                  # merged: critic + experiment_analysis + interrogation
      - figure_compose
      - report
    dynamic_routing:
      # DESIGN_REVIEW retired 2026-04 — exp_designer self-reviews inline.
      design:
        default: code_recon
        alternatives:
          - next: code
            condition: "design already reviewed or reused from prior milestone"

  fast_fail:
    sequence:
      - hypothesis
      - design
      - code
      - run
      - judge
      - report
    dynamic_routing:
      # After DESIGN in fast_fail, go directly to CODE.
      # Skips code_preflight and interrogation for speed.
      design:
        default: code
        alternatives:
          - next: run
            condition: "code already exists from prior iteration"

# ---------------------------------------------------------------------------
# Gate configuration
# ---------------------------------------------------------------------------
# Automated gates that run between stages to prevent token waste.
#
#   fast_fail_auto_block — when true (default), the scheduler inspects the
#   critic's analysis_report.md after FAST_FAIL completes. If the verdict is
#   INCONCLUSIVE with an ITERATE recommendation AND every Key Metrics row is
#   FAIL, the pipeline is auto-paused with a decision file instead of
#   proceeding to pre_main_review and MAIN stage.
gates:
  fast_fail_auto_block: true
