falsification:
  baseline: Fixed communication topology (always communicate at predefined stages),
    plus a heuristic uncertainty-triggered communication policy.
  expected_signal: At least 20% lower token cost and 15% lower latency with no more
    than 2 percentage point loss in success rate, or improved success-per-1k-tokens
    by at least 10%.
  failure_condition: Token or latency reduction is < 20% at matched success, or success
    drops by > 2 percentage points relative to the best fixed/heuristic baseline.
  hypothesis: A contextual-bandit communication gate can reduce total tokens and end-to-end
    latency by at least 20% versus fixed always-communicate or heuristic-threshold
    communication policies while maintaining task success within 2 percentage points
    on representative multi-agent workflow benchmarks.
  metric: 'Primary: success rate under a fixed token budget; Secondary: total tokens
    consumed, end-to-end latency, and success-per-1k-tokens Pareto frontier.'
