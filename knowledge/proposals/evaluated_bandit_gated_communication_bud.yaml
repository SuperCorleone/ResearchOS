innovation:
  our_delta: We propose a contextual bandit that decides at each workflow step whether
    an agent should communicate, query peers, or act independently based on predicted
    coordination value relative to budget cost.
  problem_gap: Existing methods fail because they optimize generic coordination or
    communication policies without directly learning the marginal value of each communication
    action under explicit token and latency budgets in LLM-style multi-agent workflows.
  why_it_matters: Which improves cost-efficiency and responsiveness while preserving
    task success under constrained token and latency budgets.
