innovation:
  our_delta: We propose a verifier-guided orchestration policy that treats decomposition
    as a revisable hypothesis and selectively triggers task recomposition only at
    high-risk intermediate states during execution.
  problem_gap: Existing methods fail because fixed decompositions and generic critique/escalation
    policies do not correct the task structure itself after early planning errors
    or new evidence invalidate subtask boundaries.
  why_it_matters: Which improves end-task success and reduces token cost under long-horizon,
    error-sensitive multi-agent workflows where early decomposition mistakes would
    otherwise propagate.
