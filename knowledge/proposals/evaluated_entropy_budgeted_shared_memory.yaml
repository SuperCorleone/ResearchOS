falsification:
  baseline: A standard multi-agent workflow where each agent receives the full uncompressed
    history or full shared context at every step.
  expected_signal: At least +2 percentage points success rate or equivalent non-inferior
    success (within 1 point) with >=20% lower token use.
  failure_condition: Success rate is not improved or drops by more than 1 percentage
    point while token reduction is less than 15%, averaged across tasks.
  hypothesis: Compared with standard full-context message passing, entropy-budgeted
    shared memory increases or preserves task success while reducing total tokens
    consumed in multi-agent workflows.
  metric: 'Primary: success rate on a benchmark suite of multi-agent tasks; Secondary:
    total tokens consumed per solved task. Evaluate budgeted memory at matched task
    sets and fixed model/backbone.'
  min_budget_ratio: 0.35
gate_reasons:
- total=13 >= 9
gate_result: pass
innovation:
  our_delta: We propose an entropy-budgeted shared-memory mechanism that compresses
    intermediate outputs, preserves only high-information artifacts, and selectively
    refreshes memory when uncertainty rises.
  problem_gap: Existing methods fail because multi-agent workflows often pass full
    intermediate context indiscriminately, causing token waste, context saturation,
    and propagation of low-value or redundant information without adapting memory
    retention to uncertainty.
  why_it_matters: Which improves end-to-end task success and token efficiency under
    limited context budgets and coordination-heavy multi-agent settings.
