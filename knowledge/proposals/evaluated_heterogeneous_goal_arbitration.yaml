falsification:
  baseline: Best fixed static orchestration policy selected on validation data, plus
    a single-objective adaptive controller that replans to maximize expected quality
    only.
  expected_signal: '>= 5% higher constrained utility and >= 10% lower unnecessary
    replan rate versus the better baseline.'
  failure_condition: Constrained utility improvement is < 5% over the better baseline
    or threshold-violation rate is not reduced, and replan rate is not reduced by
    at least 10% under changing conditions.
  hypothesis: A heterogeneous-goal self-adaptive controller achieves higher constrained
    utility than a static orchestration policy and a single-objective adaptive controller,
    while performing fewer unnecessary replans, under nonstationary task conditions.
  metric: 'Primary: constrained utility = task success/quality score minus penalties
    for violating latency, cost, or safety thresholds; Secondary: replan rate per
    100 tasks and threshold-violation rate.'
  min_budget_ratio: 0.2
