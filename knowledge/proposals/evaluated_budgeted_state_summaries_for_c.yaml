  failure_condition: If the summarization method fails to achieve at least 30% reduction
    in communication tokens or latency, or if task success drops by more than 2 percentage
    points absolute versus baseline, the hypothesis is disproved.
  hypothesis: Compared with passing full inter-agent reasoning traces, adaptive budgeted
    state summaries can reduce total communication tokens and workflow latency by
    at least 30% while preserving task success within a 2 percentage point absolute
    drop across representative multi-agent workflow tasks.
  metric: 'Primary: task success rate; Secondary: total communication tokens and end-to-end
