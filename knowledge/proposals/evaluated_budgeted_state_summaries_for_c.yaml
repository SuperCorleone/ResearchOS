innovation:
  our_delta: We propose an adaptive summarization layer that compresses inter-agent
    messages into budgeted state summaries while preserving uncertainty- and decision-relevant
    information needed for downstream coordination.
  problem_gap: Existing methods fail because they mainly optimize which agent communicates
    or when communication occurs, while still transmitting verbose reasoning traces
    instead of compact, decision-critical workflow state.
  why_it_matters: Which improves task success–cost efficiency and end-to-end latency
    under constrained communication budgets in multi-agent orchestration.
