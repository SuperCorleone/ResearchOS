innovation:
  our_delta: We propose a MAPE-K controller for AI agent workflows that explicitly
    models heterogeneous requirements by separating hard threshold constraints from
    optimization objectives and using that structure to drive adaptation decisions
    under uncertainty.
  problem_gap: Existing methods fail because they typically optimize a single utility
    signal or use fixed orchestration policies, so they do not explicitly reconcile
    hard constraints such as safety and cost limits with soft optimization goals such
    as quality and latency during adaptation.
  why_it_matters: Which improves overall workflow utility and reduces unnecessary
    adaptations under changing workloads, uncertainty, and multi-constraint operating
    conditions.
