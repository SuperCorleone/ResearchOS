falsification:
  baseline: Single-objective adaptive orchestrator that optimizes a weighted-sum utility
    over quality, latency, and cost without explicit hard-vs-soft requirement modeling.
  expected_signal: At least 8% higher constrained utility and 15% lower adaptation
    churn while maintaining equal or lower hard-constraint violations.
  failure_condition: Constrained utility improvement < 5% over baseline or adaptation
    churn reduction < 10%, or any statistically significant increase in hard-constraint
    violation rate.
  hypothesis: In dynamic multi-agent workflow settings with shifting workload and
    uncertainty, a heterogeneous-goal MAPE-K controller yields higher constrained
    utility and fewer unnecessary adaptations than a single-objective utility-based
    orchestrator.
  metric: 'Primary: constrained utility = task-quality score minus latency/cost penalties
    with zero credit for any run violating hard safety or budget thresholds; Secondary:
    adaptation churn rate per 100 tasks.'
  min_budget_ratio: 0.2
