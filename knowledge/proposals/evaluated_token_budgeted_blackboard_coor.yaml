falsification:
  baseline: A multi-agent workflow using standard peer-to-peer messaging with the
    same agents, task decomposition logic, and model budget, but no shared blackboard
    or selective publish/subscribe filtering.
  expected_signal: At least 15% fewer coordination tokens and 10% lower latency with
    task success no worse than -1 percentage point relative to baseline.
  failure_condition: Disproved if coordination tokens improve by less than 15%, or
    latency improves by less than 10%, or task success drops by more than 1 percentage
    point versus baseline.
  hypothesis: On decomposition-heavy AI tasks, a token-budgeted blackboard with selective
    publish/subscribe reduces total coordination tokens and end-to-end latency by
    at least 15% relative to standard peer-to-peer agent messaging, while keeping
    task success within 1 percentage point of baseline or better.
  metric: 'Primary: total coordination tokens per completed task. Secondary: end-to-end
    latency and task success rate over a fixed benchmark suite of decomposition-heavy
    tasks.'
