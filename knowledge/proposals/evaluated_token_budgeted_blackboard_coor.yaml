innovation:
  our_delta: We propose a token-budgeted blackboard coordination substrate with selective
    publish/subscribe rules that replaces broad agent-to-agent messaging with shared,
    relevance-filtered intermediate state under explicit communication constraints.
  problem_gap: Existing methods fail because multi-agent workflows often rely on broad
    peer-to-peer exchanges or ad hoc communication pruning, which leaves redundant
    coordination chatter, unstable token usage, and avoidable latency during decomposition-heavy
    tasks.
  why_it_matters: Which improves token efficiency and coordination latency while preserving
    task success under decomposition-heavy, multi-agent problem solving with tight
    communication budgets.
