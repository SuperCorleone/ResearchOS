falsification:
  baseline: Best fixed orchestration policy selected from a tuned set of static pipelines
    with predetermined decomposition depth, verifier usage, and escalation thresholds.
  expected_signal: At least 5% improvement in success-per-cost with no more than 1
    percentage point drop in task success at matched cost, or at least 2 percentage
    point gain in task success at equal budget.
  failure_condition: If success-per-cost improves by less than 5% over the best static
    baseline, or if end-task success is not at least maintained within 1 percentage
    point at equal average budget, the hypothesis is disproved.
  hypothesis: A contextual bandit router that jointly selects decomposition depth,
    verifier invocation, and escalation decisions will achieve higher success-per-cost
    than a strong static workflow policy while maintaining equal or better end-task
    success.
  metric: 'Primary: success rate divided by average cost per task; Secondary: end-task
    success rate at matched budget.'
  min_budget_ratio: 0.25
