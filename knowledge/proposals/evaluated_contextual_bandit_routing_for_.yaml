innovation:
  our_delta: We propose a unified contextual bandit controller that uses task context
    and online feedback to route decomposition, verification, and escalation actions
    within a multi-agent workflow.
  problem_gap: Existing methods fail because static orchestration and single-knob
    adaptive policies cannot jointly optimize decomposition depth, verifier use, and
    escalation decisions across heterogeneous task contexts and cost-quality tradeoffs.
  why_it_matters: Which improves task success per unit cost under variable task difficulty,
    uncertainty, and budget constraints.
