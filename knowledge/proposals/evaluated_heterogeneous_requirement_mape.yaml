innovation:
  our_delta: We propose a MAPE-K controller for multimodal reasoning agents that combines
    TUNE-style Bayesian model uncertainty estimation with explicit heterogeneous requirement
    optimization to decide when to answer, abstain, re-route, or acquire additional
    evidence.
  problem_gap: Existing methods fail because static multimodal workflows typically
    optimize a single objective and lack principled uncertainty-aware control for
    balancing accuracy, latency, and abstention under distribution shift.
  why_it_matters: Which improves reliability and accuracy-latency-risk trade-offs
    under multimodal ambiguity and distribution shift.
