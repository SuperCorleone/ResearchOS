gate_result: pass
innovation:
  our_delta: We propose Bayesian model averaging over multiple candidate orchestration
    models, with posterior updates at runtime to drive task allocation and replanning
    decisions instead of selecting one fixed best model.
  problem_gap: Existing methods fail because they commit to a single orchestration-performance
    model inside adaptive control loops, ignoring model-selection uncertainty and
    becoming overconfident when workflow conditions, agent reliability, or task dependencies
    shift.
  why_it_matters: Which improves task success and reduces unnecessary replanning under
    dynamic, nonstationary multi-agent workflow conditions.
