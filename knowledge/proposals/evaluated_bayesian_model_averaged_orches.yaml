falsification:
  baseline: Adaptive orchestration that selects and replans using the single currently
    best predictive workflow-performance model (e.g., highest posterior/validation-score
    model) without model averaging.
  expected_signal: At least +2% absolute task success and -5% relative unnecessary
    replans versus the single-model baseline.
  failure_condition: Disprove the hypothesis if task success improvement over baseline
    is < 2% absolute or non-positive, and unnecessary replan rate is not reduced by
    at least 5% relative across dynamic test scenarios.
  hypothesis: In dynamic multi-agent workflows with runtime shifts in agent reliability
    and task dependencies, Bayesian model-averaged orchestration yields higher end-to-end
    task success and fewer unnecessary replans than a single-best-model orchestration
    policy.
  metric: 'Primary: end-to-end task success rate. Secondary: unnecessary replan rate,
    defined as replans that do not improve downstream execution outcome relative to
    continuing the prior plan.'
  min_budget_ratio: 0.25
