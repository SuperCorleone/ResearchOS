gate_result: pass
innovation:
  our_delta: We propose a risk-calibrated multi-agent workflow controller that maintains
    multiple plausible execution hypotheses and escalates only subproblems whose posterior
    ambiguity remains high, using added critique, retrieval, or verification selectively
    rather than uniformly.
  problem_gap: Existing methods fail because fixed orchestration policies and single-best-controller
    decisions treat uncertain subproblems too confidently, causing either unnecessary
    verification cost or missed escalations on genuinely ambiguous steps.
  why_it_matters: Which improves task success per unit cost and reliability under
    constrained inference budgets and heterogeneous subproblem uncertainty in agentic
    workflow execution.
