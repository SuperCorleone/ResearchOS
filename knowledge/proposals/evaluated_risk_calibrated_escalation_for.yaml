falsification:
  baseline: A fixed orchestration workflow that applies the same decomposition and
    verification pattern to every subproblem, with a matched average cost budget.
  expected_signal: At least 5-10% improvement in task success per unit cost, with
    non-inferior or improved absolute success rate at equal average cost.
  failure_condition: Disproved if the proposed controller improves task success per
    unit cost by less than 5% over the fixed-policy baseline, or if success rate is
    not higher at matched average cost across the evaluation suite.
  hypothesis: A risk-calibrated escalation controller will achieve higher task success
    per unit cost than a fixed orchestration policy by selectively escalating only
    high-ambiguity subproblems.
  metric: 'Primary metric: task success per dollar (or per 1,000 tokens / unit compute).
    Secondary check: task success rate at equal average cost.'
  min_budget_ratio: 0.2
