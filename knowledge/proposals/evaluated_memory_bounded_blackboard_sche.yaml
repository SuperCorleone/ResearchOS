innovation:
  our_delta: We propose a memory-bounded blackboard scheduler that ranks intermediate
    artifacts by estimated utility and persists only the highest-value shared state
    under a strict memory budget.
  problem_gap: Existing methods fail because they either communicate too much intermediate
    state or rely on fixed coordination patterns, wasting context and tokens on low-value
    information when communication budgets are tight.
  why_it_matters: Which improves task success-per-token and latency under constrained
    communication, context-window, and multi-agent coordination budgets.
