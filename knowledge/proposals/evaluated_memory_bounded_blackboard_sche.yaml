falsification:
  baseline: Always-communicate shared blackboard that writes all intermediate artifacts
    to the shared workspace.
  expected_signal: At least 5% improvement in success-per-1K tokens with non-inferior
    task success (<=2% absolute drop) and measurable latency reduction.
  failure_condition: Disproved if success-per-1K tokens improves by less than 5% over
    baseline, or if task success drops by more than 2% absolute, or if latency does
    not improve.
  hypothesis: On complex multi-agent tasks, a utility-ranked memory-bounded blackboard
    scheduler achieves higher success-per-token than an always-communicate shared-workspace
    baseline while maintaining no worse than 2% absolute task success.
  metric: 'Primary: success-per-1K tokens; secondary: absolute task success rate and
    end-to-end latency.'
