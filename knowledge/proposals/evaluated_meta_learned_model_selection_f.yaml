innovation:
  our_delta: We propose replacing the BMA-based analyze step in the MAPE-K loop with
    a stacking-based meta-learner that learns context-dependent combinations of heterogeneous
    base models from observed predictive performance.
  problem_gap: Existing methods fail because Bayesian Model Averaging assumes the
    true model is among the candidates and uses posterior-based weighting that may
    not adapt well when heterogeneous predictive models vary in usefulness across
    contexts and mixed requirement types.
  why_it_matters: Which improves prediction accuracy and adaptation effectiveness
    under heterogeneous self-adaptive system goals involving both threshold satisfaction
    and optimization objectives.
