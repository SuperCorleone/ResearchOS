gate_result: pass
innovation:
  our_delta: We propose a self-adaptive MAPE-K-style controller that monitors uncertainty
    and task context to route each subtask among text-only, vision-language, and hybrid
    reasoning modes.
  problem_gap: Existing methods fail because they treat uncertainty-aware orchestration
    too generically, without explicitly deciding when visual reasoning is actually
    necessary, leading to unnecessary multimodal calls, higher cost/latency, and brittle
    failures when a single mode is overconfident.
  why_it_matters: Which improves end-task accuracy and cost-efficiency under changing
    input difficulty and heterogeneous multimodal workloads.
