falsification:
  baseline: Static always-multimodal workflow that invokes vision-language reasoning
    for every eligible subtask.
  expected_signal: At least 2% absolute accuracy gain at equal budget, or at least
    15% fewer multimodal calls with no accuracy drop.
  failure_condition: Disproved if accuracy improvement is < 2% at matched budget,
    or if multimodal-call reduction is < 15% while accuracy is non-superior on the
    mixed-difficulty evaluation set.
  hypothesis: A self-adaptive modality-routing controller achieves a better cost-accuracy
    trade-off than a static always-multimodal pipeline by reducing multimodal invocations
    while maintaining or improving task accuracy across mixed-difficulty inputs.
  metric: 'Primary: accuracy at equal token/API budget; Secondary: multimodal-call
    reduction rate at equal or better accuracy.'
  min_budget_ratio: 0.2
