- total=12 >= 9
gate_result: pass
innovation:
  our_delta: We propose a self-adaptive MAPE-K-style orchestration controller that
    monitors runtime trace signals, uncertainty proxies, and task-state inconsistencies
    to selectively trigger verifier and replanning agents only when estimated risk
    is elevated.
  problem_gap: Existing methods fail because static orchestration and always-on verification
    either waste tokens on low-risk steps or miss the right intervention points, allowing
    decomposition and execution errors to cascade across long-horizon workflows.
  why_it_matters: Which improves task success per token and reduces cascading failures
    under long-horizon, budget-constrained multi-agent execution.
