falsification:
  baseline: Static multi-agent orchestration with verifier invoked after every step
    or subtask (always-on verification).
  expected_signal: At least 5-10% improvement in success per 1,000 tokens with no
    increase in average token budget.
  failure_condition: Improvement in success per 1,000 tokens is < 5% versus baseline,
    or success rate is not improved while token cost is equal or higher.
  hypothesis: On long-horizon benchmark tasks, a runtime-signal-triggered verifier/replanning
    controller achieves higher success per token than a static workflow with always-on
    verification, while maintaining equal or lower total token cost.
  metric: 'Primary: successful task completion per 1,000 tokens; Secondary: final
    task success rate and mean tokens consumed per task.'
  min_budget_ratio: 0.2
