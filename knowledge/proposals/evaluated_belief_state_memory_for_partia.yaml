falsification:
  baseline: A standard message-passing multi-agent orchestration system that maintains
    only the current best task interpretation/decomposition and updates it greedily
    without explicit alternative hypothesis tracking.
  expected_signal: At least +5% absolute success rate and 10% fewer messages per successful
    task on ambiguity-heavy tasks.
  failure_condition: If the belief-state method improves success rate by less than
    2% absolute at equal communication budget, or fails to reduce messages per successful
    task by at least 5%, or increases coordination-error rate relative to baseline,
    the hypothesis is not supported.
  hypothesis: In partially observable multi-agent workflow tasks with ambiguous intermediate
    evidence, a shared belief-state memory that tracks multiple task hypotheses and
    their confidence will achieve higher task success and lower communication cost
    than standard message-passing orchestration with a single committed task state.
  metric: 'Primary: success rate under a fixed communication budget. Secondary: messages
    exchanged per successful task and coordination-error rate due to incorrect early
    commitment.'
  min_budget_ratio: 0.25
gate_reasons:
- total=13 >= 9
gate_result: pass
innovation:
  our_delta: We propose a shared belief-state memory that maintains multiple plausible
    task hypotheses with confidence scores and updates them throughout monitor-analyze-plan-execute
    cycles instead of collapsing immediately to one workflow state.
  problem_gap: Existing methods fail because they force multi-agent workflows to commit
    too early to a single task interpretation or decomposition under partial observability,
    causing brittle coordination and avoidable communication when that interpretation
    is wrong.
  why_it_matters: Which improves end-to-end task success and communication efficiency
    under partially observable, ambiguity-prone multi-agent workflows where premature
    commitment creates coordination errors.
