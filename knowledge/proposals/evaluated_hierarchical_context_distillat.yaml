  failure_condition: At the same token budget, accuracy improvement is < 2% absolute
    over the baseline, or token savings are < 15% with no accuracy gain, across the
    main benchmark suite.
  hypothesis: A hierarchical uncertainty-preserving context-distillation mechanism
    yields higher end-task accuracy per token-budget than standard full-context message
    passing in multi-agent multimodal reasoning workflows.
  metric: 'Primary: end-task accuracy at fixed total token budget. Secondary: accuracy-per-1k-tokens
