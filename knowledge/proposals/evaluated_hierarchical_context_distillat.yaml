innovation:
  our_delta: We propose a hierarchical context-distillation layer that compresses
    intermediate multimodal evidence into compact, role-specific summaries while preserving
    multiple plausible interpretations for downstream agents.
  problem_gap: Existing methods fail because multi-agent multimodal systems often
    pass a single growing shared context or single chosen interpretation, which increases
    communication cost, propagates irrelevant evidence, and collapses uncertainty
    too early.
  why_it_matters: Which improves accuracy-cost tradeoffs and coordination robustness
    under multi-agent multimodal reasoning workloads with high communication overhead
    and ambiguous evidence.
