innovation:
  our_delta: We propose a verifier-gated orchestration policy that uses lightweight
    runtime verifier signals to decide when to decompose, merge, or re-route subtasks
    instead of following a fixed multi-agent decomposition pipeline.
  problem_gap: Existing methods fail because static decomposition and fixed escalation
    apply the same handoff granularity to easy and hard cases, causing unnecessary
    coordination on simple tasks and unchecked error propagation on difficult ones.
  why_it_matters: Which improves task success per token and per latency budget under
    heterogeneous task difficulty and failure modes in multi-agent LLM workflows.
