falsification:
  baseline: LYNX-style confidence-controlled dynamic exit for multimodal reasoning
    without conformal calibration or evidence reacquisition.
  expected_signal: At least 5% relative reduction in ungrounded reasoning with <=
    1 percentage point accuracy change and measurable calibration gain.
  failure_condition: Hallucinated chain rate improvement < 5% relative or final answer
    accuracy drops by > 1 percentage point versus baseline.
  hypothesis: Compared with a strong dynamic-exit multimodal reasoning baseline, conformal
    early-stopping with evidence reacquisition reduces ungrounded reasoning while
    maintaining final answer accuracy within 1 percentage point.
  metric: 'Primary: hallucinated/ungrounded chain rate; Secondary: final answer accuracy,
    expected calibration error, and average reasoning steps or visual-tool calls.'
  min_budget_ratio: 0.35
gate_reasons:
- repeat_degree == medium (3/4 axes similar)
gate_result: professor_review
innovation:
  our_delta: We propose conformal confidence sets over intermediate multimodal reasoning
    states that trigger early stopping, chain revision, or visual evidence reacquisition
    at runtime in vision-language reasoning.
  problem_gap: Existing methods fail because they either use fixed-length or confidence-triggered
    exits without calibrated guarantees over intermediate multimodal reasoning states,
    or they provide conformal certification for tool outputs without using those signals
    to adaptively stop, revise, or reacquire evidence during the reasoning chain.
  why_it_matters: Which improves hallucination control, calibration, and inference
    efficiency under long-horizon multimodal reasoning where intermediate steps can
    drift from grounded visual evidence.
