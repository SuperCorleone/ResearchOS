falsification:
  baseline: Single best-model MAPE-K controller using one fixed environment/threat
    model and a conventional weighted-sum utility function for protection, latency,
    and cost.
  expected_signal: At least 5% higher normalized utility and 10% fewer unnecessary
    reconfigurations under shifting conditions.
  failure_condition: Normalized utility improvement is < 2% and unnecessary reconfiguration
    reduction is < 5%, or either metric is worse than baseline under distribution
    shift scenarios.
  hypothesis: In a security self-adaptive MAPE-K system facing non-stationary workload
    and threat conditions, Bayesian model averaging over multiple candidate environment/threat
    models with heterogeneous-goal decision logic yields higher utility and fewer
    unnecessary reconfigurations than a single-model expected-utility baseline.
  metric: 'Primary: average normalized multi-objective utility across protection,
    latency, and cost over time; Secondary: rate of unnecessary reconfigurations per
    100 decision intervals.'
