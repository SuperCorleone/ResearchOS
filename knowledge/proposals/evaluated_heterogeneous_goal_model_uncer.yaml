innovation:
  our_delta: We propose a Bayesian model-averaging adaptation mechanism for security-oriented
    MAPE-K loops that explicitly evaluates multiple candidate environment and threat
    models against heterogeneous threshold and optimization goals.
  problem_gap: Existing methods fail because they handle model uncertainty in self-adaptive
    systems only in limited domains and do not jointly reason over heterogeneous goals
    such as security protection, latency, and cost when choosing adaptations.
  why_it_matters: Which improves adaptation decision quality and reduces unnecessary
    or maladaptive security reconfigurations under shifting operating conditions and
    uncertain threat dynamics.
