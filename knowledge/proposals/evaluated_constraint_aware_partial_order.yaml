innovation:
  our_delta: We propose a constraint-aware partial-order task decomposition strategy
    that constructs an explicit dependency graph over subtasks, resources, and execution
    constraints so independent work can proceed in parallel while required ordering
    is preserved.
  problem_gap: Existing methods fail because they force multi-agent workflows into
    rigid sequential decompositions or rely on lightweight adaptive controls without
    explicitly representing dependency, resource, and parallel-execution constraints,
    causing unnecessary coordination cost and avoidable failure propagation.
  why_it_matters: Which improves end-to-end success rate and reduces token/latency
    overhead under workflows with nontrivial dependency structure, shared resource
    limits, and partially parallelizable subproblems.
