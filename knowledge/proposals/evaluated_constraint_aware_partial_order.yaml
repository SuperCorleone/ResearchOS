falsification:
  baseline: Fixed sequential decomposition with the same agent set, prompts, and budget,
    but a linear execution plan.
  expected_signal: At least +3 percentage points success rate and at least 5% reduction
    in both tokens and latency versus baseline.
  failure_condition: If success-rate improvement is < 3 percentage points or if token
    usage and latency are not both reduced by at least 5% relative to the sequential
    baseline on the evaluation suite, the hypothesis is not supported.
  hypothesis: On multi-agent workflows with partially independent subtasks, constraint-aware
    partial-order decomposition yields higher task success and lower coordination
    cost than fixed sequential decomposition.
  metric: 'Primary: end-to-end success rate; Secondary: total token usage and wall-clock
    latency.'
