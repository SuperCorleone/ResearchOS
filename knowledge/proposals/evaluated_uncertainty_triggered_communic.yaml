evaluator_model: ''
falsification:
  baseline: Always-on agent communication with the same agents, prompts, and workflow
    topology but mandatory inter-agent messaging at every coordination step.
  expected_signal: '>=25% fewer communication tokens and >=15% lower latency with
    <=2 percentage point success degradation.'
  failure_condition: Communication-token reduction < 25%, or latency reduction < 15%,
    or task success drops by more than 2 percentage points versus always-on baseline.
  hypothesis: Across representative multi-agent LLM workflow tasks, uncertainty-triggered
    communication gating can reduce inter-agent communication tokens by at least 25%
    and end-to-end latency by at least 15% while keeping task success within 2 percentage
    points of always-on communication.
  metric: 'Primary: task success rate, total communication tokens, and end-to-end
    latency; Secondary: calibrated uncertainty quality (e.g., ECE/Brier) and cost-success
    Pareto efficiency.'
  min_budget_ratio: 0.35
gate_reasons:
- total=13 >= 9
gate_result: pass
innovation:
  our_delta: We propose an uncertainty-triggered communication gate for multi-agent
    workflows that invokes inter-agent communication only when an agent's local uncertainty
    exceeds a calibrated threshold, with threshold selection explicitly optimized
    against task success, latency, and token budget.
  problem_gap: Existing methods fail because they treat communication adaptation mainly
    as control/coordination in physical or networked multi-agent systems, or they
    optimize workflow orchestration heuristics without framing inter-agent messaging
    in LLM workflows as a calibrated uncertainty-triggered decision under joint quality,
    latency, and token-cost objectives.
  why_it_matters: Which improves communication efficiency and end-to-end responsiveness
    under constrained token budgets and latency-sensitive multi-agent LLM tasks without
    materially reducing task success.
