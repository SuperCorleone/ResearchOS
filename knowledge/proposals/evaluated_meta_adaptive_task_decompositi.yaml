  expected_signal: '>= 3% absolute gain in success rate and >= 15% reduction in handoffs
    per successful task versus the best fixed baseline.'
  failure_condition: Disproved if success-rate improvement over the best fixed policy
    is < 2% absolute or if handoffs are not reduced by at least 10% at matched or
    better success.
  hypothesis: Across a benchmark with mixed and changing task structures, a meta-adaptive
    decomposition controller achieves higher task success rate and fewer unnecessary
    agent handoffs than the best fixed decomposition strategy.
  metric: 'Primary: end-to-end task success rate; Secondary: mean agent handoffs per
    successful task.'
