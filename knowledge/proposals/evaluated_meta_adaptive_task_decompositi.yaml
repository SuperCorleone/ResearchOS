innovation:
  our_delta: We propose a MAPE-K-style meta-controller that monitors workflow signals,
    models uncertainty over competing decomposition strategies, and dynamically switches
    among decomposition policies online.
  problem_gap: Existing methods fail because they typically commit to a single fixed
    decomposition or only add lightweight uncertainty/escalation heuristics, making
    multi-agent workflows brittle when task structure, ambiguity, or modality mix
    changes over time.
  why_it_matters: Which improves end-to-end task success and coordination efficiency
    under non-stationary task conditions where no single decomposition strategy is
    consistently best.
