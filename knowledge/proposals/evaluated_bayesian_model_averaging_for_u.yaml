falsification:
  baseline: Single-model orchestration that selects the currently best workflow-performance
    model and routes/decomposes tasks using only that model.
  expected_signal: At least 2% absolute gain in task success and at least 5% relative
    reduction in unnecessary adaptations under shift.
  failure_condition: Bayesian model averaging improves task success by less than 2%
    absolute and does not reduce unnecessary adaptation rate by at least 5% relative
    versus the single-model baseline across shifted environments.
  hypothesis: Under distribution shift in task mix and agent performance, Bayesian
    model averaging-based orchestration yields higher end-to-end task success and
    fewer unnecessary adaptations than a single best-model orchestration baseline.
  metric: 'Primary: end-to-end task success rate; Secondary: unnecessary adaptation
    rate per 100 tasks and expected calibration error of predicted workflow success.'
  min_budget_ratio: 0.2
