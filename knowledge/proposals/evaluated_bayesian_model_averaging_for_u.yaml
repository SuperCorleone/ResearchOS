gate_result: pass
innovation:
  our_delta: We propose Bayesian model averaging over multiple plausible workflow-performance
    models to guide task routing and decomposition decisions in multi-agent orchestration
    instead of committing to one selected model.
  problem_gap: Existing methods fail because single-model orchestration policies become
    overconfident when workflow-performance relationships shift, leading to misrouted
    tasks, missed adaptations, and unnecessary reconfiguration.
  why_it_matters: Which improves end-to-end task success, calibration, and adaptation
    efficiency under nonstationary task distributions and changing environment conditions.
