falsification:
  baseline: Single-model MAPE-K controller that selects the maximum-posterior (or
    best-fit) system model and plans adaptations using that model alone.
  expected_signal: At least +5% constrained utility and lower run-to-run utility variance
    than the single-model baseline.
  failure_condition: BMA improves constrained utility by less than 2% over the single-model
    baseline or fails to reduce threshold violation rate by at least 5% relative,
    across the main uncertain-runtime evaluation setting.
  hypothesis: In MAPE-K AI workflows with both hard threshold constraints and optimization
    objectives, a Bayesian model averaging controller over multiple candidate system
    models achieves higher constraint satisfaction and better overall utility than
    a single-best-model controller under runtime uncertainty.
  metric: 'Primary: constrained utility score = mean normalized optimization utility
    with zero credit on any episode violating hard thresholds; Secondary: threshold
    violation rate and utility variance across runs.'
  min_budget_ratio: 0.2
