innovation:
  our_delta: We propose a verifier-guided orchestration loop that scores decomposition
    soundness and inter-agent dependency consistency before and during execution,
    and triggers selective re-planning only when verification flags issues.
  problem_gap: Existing methods fail because planner-only multi-agent workflows can
    commit to flawed task decompositions and inconsistent dependencies too early,
    causing downstream errors and unnecessary agent calls before problems are detected.
  why_it_matters: Which improves end-to-end task success and reduces orchestration
    cost under multi-agent LLM workflows where poor decomposition quality would otherwise
    propagate expensive execution-time failures.
