falsification:
  baseline: Single-hypothesis orchestration policy that infers one best current workflow-state/failure
    cause and replans solely from that belief.
  expected_signal: At least 5% absolute gain in success rate and at least 10% reduction
    in unnecessary replanning actions per successful task versus the baseline.
  failure_condition: Disproved if success-rate improvement is < 2% absolute or non-positive
    while replanning cost is not reduced by at least 5%, averaged across shifted-task
    conditions.
  hypothesis: Compared with a single-belief orchestrator that commits to the most
    likely failure explanation at each step, a multi-hypothesis Bayesian-style workflow
    orchestrator yields higher task success and lower unnecessary re-planning cost
    on shifted tasks with ambiguous failure causes.
  metric: 'Primary: success rate under fixed budget on held-out distribution-shifted
    tasks. Secondary: replanning actions per successful task and calibration error
    of failure-cause probabilities.'
  min_budget_ratio: 0.25
gate_reasons:
- total=12 >= 9
gate_result: pass
innovation:
  our_delta: We propose a workflow orchestrator that maintains multiple latent failure
    hypotheses and performs Bayesian-style averaging over them before selecting replanning
    actions.
  problem_gap: Existing methods fail because they collapse ambiguous workflow failures
    into a single believed cause, which can produce overconfident re-planning decisions,
    wasted adaptation cost, and poor calibration when environments shift or tools
    fail unpredictably.
  why_it_matters: Which improves task success, calibration, and adaptation cost-efficiency
    under distribution shift and ambiguity about whether failures arise from tool
    unreliability, decomposition mistakes, or verifier disagreement.
