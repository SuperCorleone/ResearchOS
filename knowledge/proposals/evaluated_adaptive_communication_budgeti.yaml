falsification:
  baseline: A static multi-agent orchestration baseline with fixed numbers of agent
    messages, fixed debate rounds, and fixed verification steps tuned once on a validation
    set.
  expected_signal: At least 10% reduction in tokens and 10% reduction in latency with
    no drop in success, or at least 2% absolute success gain at equal budget.
  failure_condition: The adaptive controller fails if it does not improve task success
    by at least 2% at equal token budget, or does not reduce tokens or latency by
    at least 10% at matched success rate.
  hypothesis: A runtime adaptive communication-budget controller can achieve equal
    or higher task success than a fixed-pattern multi-agent workflow while reducing
    total token usage and end-to-end latency.
  metric: 'Primary: task success rate. Secondary: total tokens consumed and end-to-end
    latency. Evaluate Pareto improvement or cost at matched success.'
  min_budget_ratio: 0.2
