innovation:
  our_delta: We propose a MAPE-K-inspired runtime controller that monitors workflow
    signals and dynamically allocates inter-agent communication frequency, debate
    depth, and verification effort during execution.
  problem_gap: Existing methods fail because they rely on fixed communication and
    deliberation patterns that do not adapt to task difficulty, uncertainty, or diminishing
    returns, causing unnecessary token/latency overhead or missed quality gains.
  why_it_matters: Which improves cost-quality tradeoffs in multi-agent LLM workflows
    under heterogeneous task demands and constrained latency/token budgets.
