innovation:
  our_delta: We propose Bayesian model averaging over multiple competing workflow-performance
    models to drive runtime task allocation and replanning in multi-agent orchestration
    instead of selecting one fixed model.
  problem_gap: Existing methods fail because they commit to a single orchestration
    model despite shifting workflow conditions, which creates model-selection uncertainty,
    overconfident task-routing predictions, and brittle adaptation decisions.
  why_it_matters: Which improves robustness and adaptation quality under changing
    task conditions, heterogeneous agent capabilities, and nonstationary workflow
    dynamics.
