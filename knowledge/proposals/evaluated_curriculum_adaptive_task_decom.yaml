gate_result: pass
innovation:
  our_delta: We propose a multi-agent workflow controller that starts with coarse
    task decomposition and adaptively refines only recurrently failing or high-difficulty
    subtasks using online failure patterns and a task-difficulty curriculum.
  problem_gap: Existing methods fail because fixed decomposition granularity treats
    easy and hard tasks alike, causing either unnecessary agent/tool calls on simple
    cases or compounded failures on difficult cases, while prior adaptive workflow
    ideas emphasize routing, uncertainty, or verifier control rather than online curriculum-based
    granularity adjustment from observed failure trajectories.
  why_it_matters: Which improves end-to-end success rate and lowers token/agent-execution
    cost under heterogeneous task difficulty and limited inference budgets.
