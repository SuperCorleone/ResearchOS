falsification:
  baseline: 'Compare against two fixed strategies: (1) fixed coarse decomposition
    and (2) fixed fine decomposition, with matched model pool and stopping budget.'
  expected_signal: '>= 3% absolute success-rate gain over fixed coarse and >= 10%
    reduction in agent calls or token cost versus fixed fine.'
  failure_condition: Disproved if the adaptive controller improves success rate by
    less than 2 percentage points over fixed coarse, or fails to reduce mean agent
    calls/token cost by at least 10% versus fixed fine, or loses on both success and
    cost-normalized success.
  hypothesis: An online curriculum-adaptive decomposition controller achieves higher
    end-to-end task success than a fixed coarse decomposition baseline while using
    fewer redundant agent calls than a fixed fine decomposition baseline on mixed-difficulty
    benchmark tasks.
  metric: 'Primary: end-to-end success rate. Secondary: mean agent calls per solved
    task and total token cost. Aggregate comparison can use success rate subject to
    non-inferior cost, or cost-normalized success.'
  min_budget_ratio: 0.2
