falsification:
  baseline: SagaLLM-style stateful orchestration with context management and validation,
    but without explicit dependency-state commitment checking across steps.
  expected_signal: At least +5% absolute end-task success and -15% relative cross-step
    inconsistency rate with cost increase <= 10%.
  failure_condition: End-task success improvement < 2% absolute or inconsistency reduction
    < 10% relative at equal or higher normalized cost.
  hypothesis: On long-horizon multi-agent workflows with explicit inter-step dependencies,
    adding a dependency-aware state-tracking verifier yields higher end-task success
    and fewer downstream inconsistency-induced failures than transaction/validation-based
    stateful orchestration alone.
  metric: 'Primary: end-task success rate on long-horizon dependency-rich tasks; Secondary:
    cross-step inconsistency rate, rollback/replan frequency, and normalized token
    cost per successful task.'
  min_budget_ratio: 0.35
gate_reasons:
- repeat_degree == high (4/4 axes similar)
gate_result: reject
innovation:
  our_delta: We propose an explicit state-tracking verifier that maintains structured
    dependency commitments across agents and checks each new action for violations
    of prior state, temporal, and cross-step constraints.
  problem_gap: Existing methods fail because they improve routing, coordination, or
    decomposition without explicitly enforcing consistency between earlier task commitments
    and later dependent actions, allowing hidden state errors to propagate across
    long workflow horizons.
  why_it_matters: Which improves end-task success and reduces cascading failure under
    long-horizon, dependency-rich multi-agent workflows at comparable inference cost.
