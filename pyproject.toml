[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchos"
version = "0.3.0"
description = "Knowledge-Driven Multi-Agent Research Lab OS"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "anthropic>=0.39.0",
    "openai>=1.0.0",
    "pymupdf>=1.23.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
vector = ["sentence-transformers>=2.0.0", "faiss-cpu>=1.7.0", "numpy>=1.24.0"]
tracking = ["wandb>=0.16.0", "mlflow>=2.0.0"]
wandb = ["wandb>=0.16.0"]
mlflow = ["mlflow>=2.0.0"]

[project.scripts]
researchos            = "researchos.cli:main"
researchos-mcp        = "adapters.mcp.server:main"
researchos-scheduler  = "researchos.runtime.scheduler:main"
researchos-heartbeat  = "researchos.runtime.heartbeat:main"

[tool.hatch.build.targets.wheel]
packages = ["researchos", "adapters"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
